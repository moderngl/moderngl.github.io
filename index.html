<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModernGL</title>
  <link rel="icon" href="favicon.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d0d; font-family: system-ui, sans-serif; }
    img { position: fixed; inset: 0; margin: auto; width: min(360px, 60vmin); }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    nav { position: fixed; top: 20px; right: 20px; display: flex; gap: 12px; }
    nav a { padding: 10px 22px; border-radius: 999px; color: #fff; text-decoration: none; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); }
    nav a:hover { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>
  <img src="logo.png" alt="ModernGL">
  <canvas id="canvas" style="display: none"></canvas>
  <nav>
    <a href="https://github.com/moderngl/moderngl">GitHub</a>
    <a href="https://moderngl.readthedocs.io/en/latest/">Docs</a>
  </nav>
  <script type="module">
    import { loadPyodide } from 'https://cdn.jsdelivr.net/pyodide/v314.0.3/full/pyodide.mjs';
    const text = async (file) => (await fetch(file, { cache: 'no-cache' })).text();
    const pyodide = await loadPyodide();
    const wheels = (await text('wheels.txt')).trim().split('\n');
    await pyodide.loadPackage(wheels.map((name) => new URL(name, document.baseURI).href));
    pyodide.runPython(await text('scene.py'));
  </script>
</body>
</html>
